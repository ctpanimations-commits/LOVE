<style>
    body {
        align-items: center;
        text-align: center;

         button {
            padding: 12px 30px;
            font-size: 20px;
            color: #80f2ff;
            background-color: transparent;

            border: 2px solid #80f2ff;
            border-radius: 10px;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #036772;
            color: black;
            box-shadow: 0 0 15px #80f2ff;
        }
    }
</style>
